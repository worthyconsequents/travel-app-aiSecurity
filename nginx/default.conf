limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
resolver 127.0.0.11 valid=5s ipv6=off;
upstream api_backend {
  zone api_backend 64k;
  server api:8000 resolve;
}
upstream frontend_backend {
  zone frontend_backend 64k;
  server frontend:3000 resolve;
}
server {
  listen 8080;
  server_tokens off;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  location = /health { access_log off; return 200 '{"status":"ok","service":"nginx"}'; add_header Content-Type application/json; }
  location /api/ {
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://api_backend/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }
  location / { proxy_pass http://frontend_backend; proxy_set_header Host $http_host; }
}

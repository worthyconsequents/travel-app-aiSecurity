resolver 127.0.0.11 valid=5s ipv6=off;
upstream local_model_gateway { zone local_model_gateway 64k; server boring-travel-control-plane:30080 resolve; }
server {
  listen 8080;
  server_tokens off;
  client_max_body_size 32k;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Cookie "";
  location = /v1/chat/completions { proxy_pass http://local_model_gateway; }
  location / { return 404; }
}

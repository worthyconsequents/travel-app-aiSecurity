# Only joins private Docker networks; no published host ports.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream travel_mcp { zone travel_mcp 64k; server travel-discovery:8000 resolve; }
upstream reservations_mcp { zone reservations_mcp 64k; server reservations:8000 resolve; }
upstream payments_mcp { zone payments_mcp 64k; server customer-payments:8000 resolve; }
server {
  listen 8082;
  server_tokens off;
  client_max_body_size 64k;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  proxy_buffering off;
  proxy_read_timeout 120s;
  location = /health { access_log off; return 200 '{"status":"ok","service":"private-mcp-bridge"}'; }
  location = /travel-discovery/mcp { proxy_set_header Host travel-discovery:8000; proxy_pass http://travel_mcp/mcp; }
  location = /reservations/mcp { proxy_set_header Host reservations:8000; proxy_pass http://reservations_mcp/mcp; }
  location = /customer-payments/mcp { proxy_set_header Host customer-payments:8000; proxy_pass http://payments_mcp/mcp; }
  location / { return 404; }
}

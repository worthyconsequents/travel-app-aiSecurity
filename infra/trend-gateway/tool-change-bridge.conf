resolver 127.0.0.11 valid=5s ipv6=off;
upstream fixture { zone fixture 64k; server tool-change-fixture:8000 resolve; }
upstream travel_bridge { zone travel_bridge 64k; server trend-mcp-bridge:8082 resolve; }
server {
  listen 8082;
  server_tokens off;
  client_max_body_size 16k;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  proxy_set_header Host tool-change-fixture:8000;
  proxy_buffering off;
  location = /mcp { proxy_pass http://fixture/mcp/; }
  # Preserve the three registered private URLs after the bridge IP was reused.
  # The existing travel bridge still verifies its own upstream key.
  location ~ ^/(travel-discovery|reservations|customer-payments)/mcp$ {
    proxy_pass http://travel_bridge;
  }
  location / { return 404; }
}

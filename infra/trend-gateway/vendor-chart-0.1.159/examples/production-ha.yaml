# Production HA — multi-replica gateway, autoscaling, PDB, ServiceMonitor,
# pod anti-affinity, topology spread. External V1 server expected.

gateway:
  replicaCount: 3
  visionone:
    url: "https://stargate-v1.example.com"
    # Many replicas, one shared device token: the leader rotates it into a Secret
    # the chart owns. Paste the enrollment bootstrap token from the server's
    # gateway Setup (or set authToken.existingSecret to manage it yourself).
    authToken:
      bootstrap:
        token: "<paste-bootstrap-token-from-Setup>"
  config:
    log:
      level: info
      format: json

  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits:   { cpu: "4",    memory: "2Gi"   }

  secrets:
    openai:
      existingSecret: stargate-llm-keys
      key: openai      # mounted at /etc/secrets/gateway/openai

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 65
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - { type: Percent, value: 25, periodSeconds: 60 }
      scaleUp:
        stabilizationWindowSeconds: 30
        policies:
          - { type: Percent, value: 100, periodSeconds: 60 }
          - { type: Pods,    value: 4,   periodSeconds: 60 }

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  serviceMonitor:
    enabled: true
    interval: 30s

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: gateway

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: gateway

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    hosts:
      - host: llm.example.com
        paths:
          - { path: /v1, pathType: Prefix, port: llmProxy }
      - host: mcp.example.com
        paths:
          - { path: /, pathType: Prefix, port: mcpProxy }
    tls:
      - hosts: [llm.example.com, mcp.example.com]
        secretName: stargate-tls

server:
  enabled: false

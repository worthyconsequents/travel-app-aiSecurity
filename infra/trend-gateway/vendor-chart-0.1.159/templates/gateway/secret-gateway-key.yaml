{{- if and .Values.gateway.enabled (not .Values.gateway.gatewayKey.existingSecret) -}}
{{/* Gateway X25519 keypair (32-byte private key; public derived at load). Shared
     by every gateway replica so the customer DEK the leader receives — sealed to
     this public key and fanned out through the shared store — can be opened by
     any replica, not just the leader that polled. This is the plain-helm
     convenience path: generated once and preserved across upgrades via lookup.
     `helm template` / GitOps have no lookup and would regenerate it, so set
     gateway.gatewayKey.existingSecret there (this template is then skipped and
     the chart mounts the operator's Secret). Regenerating is self-healing — the
     DEK is re-delivered on the next catalog poll — so keep guards it from
     deletion but a lost key isn't catastrophic like the KEK. */}}
{{- $name := include "ai-gateway.gateway.gatewayKeySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "gateway.key") -}}
{{- $key = index $existing.data "gateway.key" -}}
{{- else -}}
{{/* randBytes already returns base64 — a Secret data value; k8s decodes it to
     32 raw bytes at the mount, which loads as the X25519 private key. */}}
{{- $key = randBytes 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  gateway.key: {{ $key }}
{{- end }}

{{- if and .Values.gateway.enabled (not .Values.gateway.visionone.authToken.existingSecret) -}}
{{- $name := include "ai-gateway.gateway.authTokenSecretName" . -}}
{{/* One Secret holds the token for the whole device-token lifecycle. Fresh
     install: Vision One needs a real bootstrap token (or existingSecret);
     self-hosted has no external auth, so a random token is generated. The
     gateway reads it from the mount, enrolls, and the leader rotates the device
     token back into this same Secret. Upgrade: reuse the live token so the
     rotated device token is never reset. */}}
{{- $token := .Values.gateway.visionone.authToken.bootstrap.token -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing (index $existing.data "token") -}}
{{- $token = (index $existing.data "token" | b64dec) -}}
{{- else if not $token -}}
{{- if .Values.gateway.visionone.url -}}
{{- fail "Vision One auth needs a device token: set gateway.visionone.authToken.bootstrap.token or gateway.visionone.authToken.existingSecret." -}}
{{- else -}}
{{- $token = randAlphaNum 40 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}

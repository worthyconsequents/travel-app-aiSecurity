{{- if and .Values.gateway.enabled .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ai-gateway.gateway.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  # The kube coordinator runs each background task behind a Lease so exactly one
  # replica acts at a time — catalog-sync and token-rotation. The self-hosted
  # server carries its own equivalent Role in the ai-gateway-server chart.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ai-gateway.gateway.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ai-gateway.gateway.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

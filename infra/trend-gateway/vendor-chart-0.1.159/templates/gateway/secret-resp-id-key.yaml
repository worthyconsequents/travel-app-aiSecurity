{{- if .Values.gateway.enabled -}}
{{/* AES-256 key that owner-binds Responses resp_ ids. Internal, never
     operator-supplied; regenerated per apply (resp_ ids are ephemeral). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-gateway.gateway.respIDKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  resp-id-key: {{ randBytes 32 | quote }}
{{- end }}

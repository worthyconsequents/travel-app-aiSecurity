{{- if .Values.gateway.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.fullname" . }}-redis
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  ports:
    - name: redis
      port: {{ .Values.gateway.redis.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "ai-gateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}

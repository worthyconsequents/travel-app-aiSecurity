{{- if .Values.gateway.enabled -}}
{{- include "ai-gateway.policyServerGuard" . -}}
{{- include "ai-gateway.gatewayRedisGuard" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-gateway.gateway.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  config.yaml: |
{{ include "ai-gateway.gateway.configYAML" . | indent 4 }}
{{- end }}

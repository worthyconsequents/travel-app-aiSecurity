{{- if and .Values.admin.masterKey.enabled (not .Values.admin.masterKey.existingSecret) -}}
{{- $name := include "ai-gateway.admin.masterKeySecretName" . -}}
{{/* One Secret holds the admin master key, mounted read-only on both the
     gateway and the server. Fresh install: use the value from values, else
     generate a random sk- key. Upgrade: reuse the live value so a key the
     gateway rotated in (POST /admin/key/regenerate) is never reset. */}}
{{- $key := .Values.admin.masterKey.value -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing (index $existing.data "master-key") -}}
{{- $key = (index $existing.data "master-key" | b64dec) -}}
{{- else if not $key -}}
{{- $key = printf "sk-%s" (randAlphaNum 40) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  master-key: {{ $key | quote }}
{{- end }}

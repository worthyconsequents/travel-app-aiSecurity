# Reachable only inside the existing Docker kind network; no host port mapping.
apiVersion: v1
kind: Service
metadata:
  name: dannytran-local-llm-probe
  namespace: trendai-gateway
  labels:
    app.kubernetes.io/part-of: boring-travel-trend-test
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/instance: trendai-gateway
    app.kubernetes.io/component: gateway
  ports:
    - name: llm
      port: 8080
      targetPort: 8080
      nodePort: 30080

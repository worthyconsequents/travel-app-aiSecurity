# Merge with --reuse-values on the existing local release. Contains references only.
gateway:
  # The console currently normalizes platform-file references to these names.
  secretsDir:
    existingSecret: dannytran-travel-mcp-upstream
    mountPath: /etc/secrets/gateway
  secrets:
    travel-mcp-upstream:
      existingSecret: dannytran-travel-mcp-upstream
      key: key
      mountPath: /etc/secrets/travel-mcp/key

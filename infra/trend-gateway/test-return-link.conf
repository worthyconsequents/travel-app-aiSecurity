resolver 127.0.0.11 valid=5s ipv6=off;
upstream trend_mcp { zone trend_mcp 64k; server boring-travel-control-plane:30081 resolve; }
server {
  listen 8081;
  server_tokens off;
  client_max_body_size 64k;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Cookie "";
  proxy_buffering off;
  proxy_read_timeout 120s;
  location = / { proxy_pass http://trend_mcp; }
  location = /health { proxy_pass http://trend_mcp/health; }
  location / { return 404; }
}

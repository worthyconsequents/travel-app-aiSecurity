# Apply after compose.test-runner.yaml, with prepared private files.
services:
  api:
    environment:
      TOOL_CHANGES_ENABLED: 'true'
  test-worker:
    user: "${TREND_LOCAL_UID:?}:${TREND_LOCAL_GID:?}"
    environment:
      TOOL_CHANGES_ENABLED: 'true'
      TOOL_CHANGE_CONTROL_KEY_FILE: /run/secrets/tool_change_control
      TOOL_CHANGE_UPSTREAM_KEY_FILE: /run/secrets/trend_upstream_key
      TOOL_CHANGE_MAP_FILE: /run/secrets/tool_change_map
    secrets: [tool_change_control, trend_upstream_key, tool_change_map]
    depends_on:
      tool-change-fixture: {condition: service_healthy}
  tool-change-fixture:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: [uvicorn, services.tool_change_fixture:create_app, --factory, --host, 0.0.0.0, --port, '8000']
    user: "${TREND_LOCAL_UID:?}:${TREND_LOCAL_GID:?}"
    environment:
      APP_MODE: local
      TOOL_CHANGES_ENABLED: 'true'
      TOOL_CHANGE_CONTROL_KEY_FILE: /run/secrets/tool_change_control
      TOOL_CHANGE_UPSTREAM_KEY_FILE: /run/secrets/trend_upstream_key
    secrets: [tool_change_control, trend_upstream_key]
    networks: [private]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
secrets:
  tool_change_control:
    file: ./infra/trend-gateway/private/tool-change-control-key
  trend_upstream_key:
    file: ./infra/trend-gateway/private/travel-upstream-key
  tool_change_map:
    file: ./build/trend/tool-change-map.json

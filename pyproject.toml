[project]
name = "travel-agent-security-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=1.26,<2", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "boto3>=1.40,<2", "jsonschema>=4.23,<5", "pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["mcp"]

known-first-party = ["services", "scripts"]
